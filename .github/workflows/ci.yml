# CreditCast CI — every push and pull request.
#
#   python : unit tests -> full lifecycle (generate -> ... -> CI gates) -> all tests
#            A failing performance gate (Gini / KS / calibration / PSI) fails the build.
#   web    : build the static Risk Cockpit (Next.js export)
#   docker : build the single-container image (main branch + manual runs only;
#            the image's trainer stage re-runs the lifecycle, so it is slow)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  python:
    name: Tests + lifecycle gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # matches the Dockerfile
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Lock files match requirements*.in
        run: |
          pip install "uv==0.12.23"
          sh scripts/lock-deps.sh
          git diff --exit-code -- requirements.txt requirements-serve.txt || {
            echo "::error::Lock files are out of date with requirements*.in. Run: sh scripts/lock-deps.sh"
            exit 1; }

      - name: Install dependencies (pinned, hash-checked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Formatting (ruff format)
        run: ruff format --check .

      - name: Type check (mypy, typed core)
        run: mypy

      - name: Unit tests (no artifacts needed)
        run: python -m pytest -q

      - name: Full lifecycle + CI performance gates
        run: python -m creditcast.cli all

      - name: All tests incl. artifact-dependent, with coverage
        run: |
          python -m pytest -q --cov=creditcast --cov=app --cov-report=term-missing:skip-covered \
            --cov-report=xml --cov-fail-under=80

      - name: Job summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          art = pathlib.Path("creditcast/artifacts")
          try:
              tm = json.loads((art / "train_metrics.json").read_text())
              val = json.loads((art / "validation_report.json").read_text())
              gov = json.loads((art / "governance_report.json").read_text())
          except FileNotFoundError:
              print("Lifecycle did not produce reports."); raise SystemExit
          ch = val["models"][val.get("champion", "challenger")]
          el = tm["expected_loss"]
          print("### CreditCast model metrics (OOT)\n")
          print("| Metric | Value |\n|---|---|")
          print(f"| Champion | {val.get('champion', 'challenger')} |")
          print(f"| Gini | {ch['discrimination']['gini']:.4f} |")
          print(f"| KS | {ch['discrimination']['ks']:.4f} |")
          print(f"| Calibration max band error | {ch['calibration']['max_band_error']:.4f} |")
          print(f"| Threshold ({gov['decision'].get('threshold_source', '?')}) | {gov['decision']['threshold']:.4f} |")
          print(f"| Approval rate | {gov['decision']['approval_rate']:.1%} |")
          print(f"| Min disparate-impact ratio | {gov['fairness']['di_ratio_min_observed']:.3f} |")
          print(f"| Portfolio EL rate | {el['el_rate_bps']:.1f} bps |")
          EOF

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creditcast-reports
          path: |
            creditcast/artifacts/*.json
            creditcast/reports/*.html
            creditcast/governance/model_card.md
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"              # LTS; matches the Dockerfile and the lockfile's npm 11
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Lint (ESLint, next/core-web-vitals)
        run: npm run lint
      - name: Component tests (Vitest + Testing Library)
        run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      E2E_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Train models (seeded lifecycle)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m creditcast.cli all

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Build the cockpit
        working-directory: app/dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium

      - name: Start CreditCast (API + cockpit) and wait until ready
        run: |
          STATIC_DIR=app/dashboard/out nohup python -m uvicorn app.api.main:app \
            --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS "$E2E_BASE_URL/api/ready" > /dev/null && break
            sleep 2
          done
          curl -fsS "$E2E_BASE_URL/api/ready"

      - name: Playwright (desktop + phone)
        working-directory: app/dashboard
        run: npx playwright test

      - name: Upload Playwright report and server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/dashboard/playwright-report
            app/dashboard/test-results
            server.log
          retention-days: 7

  docker:
    name: Docker image build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [python, web, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build image (trainer stage runs the lifecycle + gates)
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t creditcast:ci .

      - name: Run container and wait for HEALTHCHECK (/api/ready)
        run: |
          docker run -d --name cc -p 8000:8000 creditcast:ci
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' cc)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && { docker logs cc; exit 1; }
            sleep 5
          done
          [ "$status" = "healthy" ] || { docker logs cc; exit 1; }
          curl -fsS http://localhost:8000/api/ready
          curl -fsS http://localhost:8000/api/health   # served registry version + git sha
          curl -fsS -o /dev/null -w "cockpit: %{http_code}\n" http://localhost:8000/
          curl -fsS -H 'content-type: application/json' \
            -d '{"fico":690,"dti":38,"ltv":82,"orig_interest_rate":4.3,"orig_upb":300000,"orig_loan_term":360,"occupancy_status":"P","loan_purpose":"N","property_type":"CO","first_time_homebuyer":"Y"}' \
            http://localhost:8000/api/score
          docker exec cc sh -c 'wc -l /app/logs/decisions.jsonl'

      - name: Container goes unhealthy when a model artifact is missing
        run: |
          docker exec cc rm /app/creditcast/artifacts/lgd.joblib
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/ready)
          echo "/api/ready after removing lgd.joblib -> $code"
          [ "$code" = "503" ]
