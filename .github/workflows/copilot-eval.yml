# CreditCast Copilot evaluation (ROADMAP 5.7) — nightly: asks the agent team the
# 20 questions in tests/eval/copilot_questions.yaml and checks each answer
# states the right figures and invents none. Fails below a 90% pass rate.
#
# Needs the repository secret GROQ_API_KEY; without it the run is skipped.
# The pass-rate history is kept as a workflow artifact per run.
name: Copilot eval

on:
  schedule:
    - cron: "0 3 * * *"          # daily 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copilot-eval
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Skip without an LLM key
        if: env.GROQ_API_KEY == ''
        run: echo "GROQ_API_KEY secret not set - Copilot eval skipped."

      - uses: actions/checkout@v4
        if: env.GROQ_API_KEY != ''

      - uses: actions/setup-python@v5
        if: env.GROQ_API_KEY != ''
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: env.GROQ_API_KEY != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build models and reports
        if: env.GROQ_API_KEY != ''
        run: python -m creditcast.cli all

      - name: Ask the 20 questions
        if: env.GROQ_API_KEY != ''
        run: python -m creditcast.eval.copilot_eval

      - name: Upload results
        if: always() && env.GROQ_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: copilot-eval
          path: |
            creditcast/reports/copilot_eval_latest.json
            creditcast/reports/copilot_eval_history.jsonl
          if-no-files-found: warn
          retention-days: 90
