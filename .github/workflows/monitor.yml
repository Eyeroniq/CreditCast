# CreditCast drift monitor — weekly PSI/CSI check of the scored population vs
# the training baseline. If anything is drifting ("watch" or "unstable"), it
# opens a GitHub issue labelled `drift-alert`, or comments on the open one.
#
# Manual run: Actions → Drift monitor → Run workflow. Tick "force_alert" to
# test the alert path end to end (opens/updates the issue even when healthy).
name: Drift monitor

on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      force_alert:
        description: "Open/update the drift-alert issue even if healthy (test the alert path)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: drift-monitor
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Reproducible: the seeded pipeline rebuilds the exact models + baseline.
      - name: Rebuild models and training baseline
        run: |
          python -m creditcast.cli generate
          python -m creditcast.cli pipeline
          python -m creditcast.cli train

      - name: Drift check (PSI / CSI vs baseline)
        id: drift
        run: |
          python -m creditcast.cli monitor
          python - <<'EOF'
          import json, os
          r = json.load(open("creditcast/artifacts/monitoring_report.json"))
          alerts = r["alerts"]
          lines = [
              "### CreditCast drift monitor",
              "",
              f"- Batch size: **{r['n_batch']:,}** loans",
              f"- Score PSI: **{r['score_psi']}** ({r['score_status']})",
              f"- Healthy: **{r['healthy']}**",
              "",
          ]
          if alerts:
              lines += ["| Signal | PSI | Status |", "|---|---|---|"]
              lines += [f"| {a['signal']} | {a['psi']} | {a['status']} |" for a in alerts]
          else:
              lines.append("No drifting signals (all PSI/CSI < watch threshold).")
          body = "\n".join(lines)
          open("drift_summary.md", "w").write(body)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(body + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"healthy={str(r['healthy']).lower()}\n")
          EOF

      - name: Open or update drift-alert issue
        if: steps.drift.outputs.healthy == 'false' || inputs.force_alert
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FORCED: ${{ inputs.force_alert }}
        run: |
          gh label create drift-alert --color D93F0B \
            --description "Population drift detected by the weekly monitor" --force
          {
            cat drift_summary.md
            echo
            if [ "$FORCED" = "true" ]; then
              echo "_Forced alert (manual test run) — not necessarily real drift._"
            fi
            echo "Run: $RUN_URL"
          } > issue_body.md
          existing=$(gh issue list --label drift-alert --state open --limit 1 \
                       --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue_body.md
            echo "Commented on #$existing"
          else
            gh issue create --title "Drift alert: population shift vs training baseline" \
              --label drift-alert --body-file issue_body.md
          fi

      - name: Upload monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-report
          path: creditcast/artifacts/monitoring_report.json
          if-no-files-found: warn
          retention-days: 30
