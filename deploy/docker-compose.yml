# CreditCast production stack for https://dhyyraj.in
#
#   app   : the single CreditCast container (API under /api + Risk Cockpit at /)
#   caddy : reverse proxy with automatic HTTPS (Let's Encrypt) for the domain
#
# Run on the server from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}   # GIT_SHA=$(git rev-parse --short HEAD) docker compose ... up
    image: creditcast:latest
    restart: unless-stopped
    env_file:
      - path: ../.env            # GROQ_API_KEY=... (optional: enables Risk Copilot)
        required: false
    environment:
      PORT: "8000"
      # Trust X-Forwarded-For from the proxy so rate limits are per real
      # client IP (the app port is only reachable by caddy, never public).
      FORWARDED_ALLOW_IPS: "*"
      CC_LOG_DIR: /app/logs      # decision audit trail (decisions.jsonl)
      # CC_API_KEY: set in ../.env only for an API-only deployment (it would
      # also block the public cockpit's scoring + Copilot).
    volumes:
      - decision_logs:/app/logs  # keep the audit trail across rebuilds
    expose:
      - "8000"                   # only reachable by caddy, not the internet

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy   # wait for /api/ready (models loaded)
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"            # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # TLS certificates (keep across restarts)
      - caddy_config:/config

volumes:
  decision_logs:
  caddy_data:
  caddy_config:
