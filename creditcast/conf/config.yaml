# ============================================================================
# CreditCast — central configuration
# Single source of truth for thresholds, scaling, cutoffs, and run stamps.
# Nothing in the modeling/validation code is hardcoded; it reads from here.
# ============================================================================

run:
  seed: 42                      # global determinism
  data_version: "synthetic-v3"  # bump when the generator schema changes (v2: cures + data cutoff; v3: property state + macro series)
  code_version: "0.1.0"

paths:
  bronze: "creditcast/data/bronze"
  silver: "creditcast/data/silver"
  gold:   "creditcast/data/gold"
  macro:  "creditcast/data/macro"   # monthly state unemployment + house-price index (5.1)
  artifacts: "creditcast/artifacts"
  reports:   "creditcast/reports"
  model_card: "creditcast/governance/model_card.md"   # committed; copied into the image

tracking:
  enabled: true                 # MLflow run logging (best-effort; off in tests)

# ---- Model registry / serving (ROADMAP 2.5) ----------------------------------
serving:
  # Roll back by pinning a registered version (e.g. "v0003"): the API restores
  # it from artifacts/registry when it starts. null = serve the latest run.
  pinned_version: null

# ---- Synthetic GSE-schema generator -----------------------------------------
# Mimics Freddie Mac Single-Family loan-level + monthly performance schema so
# real GSE files drop into the exact same Silver/Gold pipeline later.
generator:
  n_loans: 60000
  vintage_start: "2015-01"      # origination cohorts, monthly
  vintage_end:   "2021-12"
  perf_horizon_months: 24       # monthly performance rows generated per loan
  base_default_rate: 0.045      # portfolio-level 12m default rate (realistic mortgage)
  recovery_mean: 0.65           # for LGD: mean recovery fraction on defaults
  cure_rate: 0.25               # share of defaults that cure (back to current, 0 loss)
  data_cutoff: "2022-06"        # last reporting month in the panel (like a real data drop);
                                # recent vintages are right-censored by it
  # Property state mix (Freddie's property_state). Used only to look up macro
  # conditions; state itself is never a model input (geography can proxy for
  # protected groups — redlining).
  state_weights: {CA: 0.18, TX: 0.14, FL: 0.12, NY: 0.09, IL: 0.08, PA: 0.08, OH: 0.08, GA: 0.08, NC: 0.08, MI: 0.07}
  # How origination-time macro conditions move the latent default logit
  # (per point of unemployment / per point of 12m change / per % of 12m HPI growth).
  macro_effect: {unemp_rate: 0.05, unemp_chg_12m: 0.03, hpi_chg_12m: -0.015}

# ---- Macro-economic features (ROADMAP 5.1) -----------------------------------
macro:
  lag_months: 1                 # a loan in month M sees macro values from M-1 (published by then)
  source: synthetic             # synthetic: the generator writes seeded series; files: use real CSVs in data/macro
  features: [unemp_rate, unemp_chg_12m, hpi_chg_12m]

# ---- Regulatory capital: Basel IRB, retail residential mortgages (ROADMAP 5.5) ----
capital:
  correlation: 0.15             # Basel asset correlation for residential mortgages
  confidence: 0.999             # one-year 99.9% loss quantile
  pd_floor: 0.0005              # Basel III: 0.05% for residential mortgages
  lgd_floor: 0.05               # Basel III: 5% for residential mortgages

# ---- Stress testing (ROADMAP 5.2) ----------------------------------------------
# Shocks on top of each loan's actual origination conditions: unemployment up by
# N points (level and 12-month change), house prices moved by N percent.
stress:
  scenarios:
    baseline:         {label: "Baseline",         unemployment_pts: 0, hpi_change_pct: 0}
    adverse:          {label: "Adverse",          unemployment_pts: 3, hpi_change_pct: -10}
    severely_adverse: {label: "Severely adverse", unemployment_pts: 6, hpi_change_pct: -25}
  # Bounds for custom shocks through the API
  limits: {unemployment_pts: [-5, 15], hpi_change_pct: [-50, 30]}

# ---- Target definition (leakage discipline) ---------------------------------
target:
  observation_horizon_months: 12   # forward-looking default window
  default_dpd_threshold: 90        # 90+ DPD (or foreclosure/disposition) => default
  # Freddie zero-balance codes. Default-type exits: 02 third-party sale,
  # 03 short sale/charge-off, 09 REO disposition, 15 note sale. Clean exit: 01 prepaid.
  default_zb_codes: ["02", "03", "09", "15"]
  prepay_zb_codes: ["01"]
  # Right-censoring: loans not observed for the full window (and not prepaid)
  # have an untrustworthy "no default" label. drop | keep_flagged
  censoring: "drop"
  # Out-of-time split: train on older vintages, test on newer. Honest test.
  oot:
    train_vintage_end: "2019-12"   # train: <= this origination month
    test_vintage_start: "2020-01"  # test:  >= this origination month
    calib_fraction: 0.15           # held-out calibration set carved from train
    valid_fraction: 0.10           # held-out early-stopping set (challenger) carved from train

# ---- Feature sets ------------------------------------------------------------
features:
  # Borrower + loan attributes available AT origination/observation (no look-ahead)
  numeric:
    - fico
    - dti
    - ltv
    - orig_interest_rate
    - orig_upb
    - orig_loan_term
  categorical:
    - occupancy_status
    - loan_purpose
    - property_type
    - first_time_homebuyer
  # Protected attribute for fairness analysis (FHFA-style); never a model input
  protected:
    - borrower_race

# ---- WoE / scorecard ---------------------------------------------------------
scorecard:
  iv_min: 0.02          # drop near-useless features
  iv_max: 0.5           # IV > 0.5 is suspicious (possible leakage) -> review
  min_bin_size: 0.05    # each WoE bin >= 5% of population
  monotonic_trend: "auto"
  # Points-to-double-odds scaling (industry standard scorecard scaling)
  pdo: 20
  base_score: 600
  base_odds: 50         # odds of good:bad at base_score

# ---- Challenger (LightGBM) ---------------------------------------------------
challenger:
  n_estimators: 2000           # upper bound; early stopping picks the real count
  learning_rate: 0.03
  num_leaves: 15
  min_child_samples: 200       # regularization: avoid overfitting the rare class
  reg_lambda: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 80
  # Imbalance handling (Part 10.5): we DON'T reweight the positive class for the
  # ranking model — scale_pos_weight distorts gradients and hurts Gini, and we
  # fix probability *levels* downstream with isotonic calibration anyway. The
  # imbalance is instead respected via AUC/PR-AUC metrics + a cost-based decision
  # threshold. Set true to A/B the reweighted variant.
  use_scale_pos_weight: false

# ---- Calibration -------------------------------------------------------------
calibration:
  # sigmoid (Platt): smooth PDs. Isotonic was tried first but its step function
  # put up to 23% of loans on one PD, so approval jumped ~20pp depending on
  # which side of the cut-off a step landed (ROADMAP 1.8). isotonic | sigmoid
  method: "sigmoid"
  pd_floor: 0.0003      # Basel 3 bp PD floor: no applicant is ever "riskless"

# ---- LGD / EAD ---------------------------------------------------------------
lgd:
  method: "two_stage"   # cure model (P[loss>0]) x severity regressor
  workout_window_months: 36   # months after default to observe the final loss (LGD only)
  cure_months: 6              # months back at current (0 DPD) after default = cured, 0 loss
ead:
  ccf: 1.0              # fully-drawn mortgage: EAD ~= outstanding balance
  expected_default_month: 6   # months of payments made before default (scheduled balance)

# ---- Validation thresholds (also enforced as CI gates, Part 10.3) -----------
validation:
  gini_min: 0.35             # minimum acceptable out-of-time Gini
  ks_min: 0.25
  hl_pvalue_min: 0.01        # Hosmer-Lemeshow: fail build if catastrophically rejected
  calibration_max_band_error: 0.03   # max |pred - obs| default rate per band
  psi_bins: 10
  psi_watch: 0.10            # < 0.10 stable, 0.10-0.25 watch, > 0.25 unstable
  psi_unstable: 0.25
  n_score_bands: 10

# ---- Decision / business -----------------------------------------------------
decision:
  # Champion PD model: drives Expected Loss, approve/decline and reason codes.
  # challenger (LightGBM + SHAP reasons) | scorecard (WoE points-lost reasons)
  champion: "challenger"
  # How the approve/decline cut-off is set (both are always reported):
  #   closed_form: approve if PD <= cost_fp / (cost_fp + cost_fn). Optimal for
  #                calibrated PDs and stable (doesn't move with sample noise).
  #   empirical:   minimise realised cost on the calib slice (noisy when the
  #                cost curve is flat — see ROADMAP 1.8).
  threshold_method: "closed_form"
  # Threshold from cost of false-negative vs false-positive (made explicit)
  cost_fn: 15.0              # cost of approving a defaulter (loss >> lost margin)
  cost_fp: 1.0               # cost of declining a good borrower (lost margin)
  # Risk bands on the scaled score (low score = high risk)
  # Floors aligned to the realized score distribution (pdo=20 scaling compresses
  # the range to the model's discriminatory power) so every grade is populated
  # with a monotonic default rate. Re-tune if pdo/base_score change.
  bands:
    - {name: "AAA", min_score: 630}
    - {name: "AA",  min_score: 610}
    - {name: "A",   min_score: 590}
    - {name: "BBB", min_score: 568}
    - {name: "BB",  min_score: 545}
    - {name: "B",   min_score: 0}

# ---- Agents (Risk Copilot) ---------------------------------------------------
# An LLM layer that ONLY orchestrates the real tools + narrates — the model core
# stays classical ML. Free, fast Groq backend (OpenAI-compatible tool-calling).
agents:
  provider: groq
  model: "llama-3.3-70b-versatile"   # strong tool-use on Groq's free tier
  temperature: 0.2
  max_tool_iters: 4                  # per-specialist LLM<->tool round trips
  max_specialists: 3                 # how many specialists the orchestrator may use

# ---- Public API limits (Phase 3) ---------------------------------------------
# Per client IP. Behind the Caddy proxy the real IP comes from X-Forwarded-For
# (uvicorn trusts it via FORWARDED_ALLOW_IPS, set in deploy/docker-compose.yml).
api:
  rate_limits:
    score: "60/minute"
    whatif: "30/minute"
    portfolio: "30/minute"
    stress: "20/minute"               # each custom scenario re-scores the OOT book
    agent_chat: "10/minute;100/day"   # protects the free Groq quota
  max_question_chars: 500
  portfolio_max_rows: 1000

# ---- Fairness ----------------------------------------------------------------
fairness:
  protected_attribute: "borrower_race"
  privileged_group: "White"
  # Acceptable disparate-impact ratio band (4/5ths rule -> 0.8)
  di_ratio_min: 0.80
